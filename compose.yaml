version: '3.8'

services:
  backend:
    build:
      context: ./django_backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=https://${DEFANG_FRONTEND_URL}
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8002/api/history/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=https://${DEFANG_BACKEND_URL}
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        reservations:
          memory: 256M

volumes:
  backend_uploads:
  backend_db:
