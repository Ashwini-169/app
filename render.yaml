services:
  - type: web
    name: chemical-backend
    env: docker
    dockerfilePath: ./django_backend/Dockerfile
    dockerContext: ./django_backend
    envVars:
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: PORT
        value: 8000
    healthCheckPath: /api/health/
    
  - type: web
    name: chemical-frontend
    env: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: NODE_ENV
        value: production
      - key: REACT_APP_API_URL
        sync: false
    healthCheckPath: /
